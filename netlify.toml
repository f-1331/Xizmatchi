[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_DEPLOY_PREVIEWS_DRAWER = "false"
  NETLIFY_DRAWER = "false"
  NETLIFY_FEEDBACK_DRAWER = "false"

[context.deploy-preview]
  environment = { NETLIFY_DEPLOY_PREVIEWS_DRAWER = "false", NETLIFY_DRAWER = "false" }

[context.branch-deploy]
  environment = { NETLIFY_DEPLOY_PREVIEWS_DRAWER = "false", NETLIFY_DRAWER = "false" }

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
